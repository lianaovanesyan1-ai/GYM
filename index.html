<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фитнес Тракер</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #00e676;
            --text-color: #ffffff;
            --text-dim: #a0a0a0;
            --border-color: #2a2a32;
            --fire-color: #ff5722;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            padding-bottom: 80px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1, h2, h3 {
            margin-top: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .streak-card {
            background: linear-gradient(135deg, #1e1e24, #2a2a35);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .streak-count {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .calendar-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
            margin-top: 10px;
        }

        .day-header {
            font-size: 12px;
            color: var(--text-dim);
            font-weight: bold;
            padding-bottom: 5px;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background-color: #2a2a32;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .day-cell.active-workout {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
        }

        .day-cell.today {
            border: 2px solid var(--accent-color);
        }

        .day-cell.empty {
            background: transparent;
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-secondary {
            background-color: #2a2a32;
            color: var(--text-color);
        }

        .btn-small {
            width: auto;
            padding: 6px 12px;
            font-size: 12px;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid var(--border-color);
        }

        .nav-item {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-color);
            font-weight: bold;
        }

        .exercise-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .exercise-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .set-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
        }

        input {
            background-color: #2a2a32;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px;
            border-radius: 6px;
            width: 70px;
            text-align: center;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .pr-fire {
            color: var(--fire-color);
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ТАБ 1: ДНЕВНИК & КАЛЕНДАР -->
    <div id="tab-tracker" class="tab-content active">
        <div class="header">
            <h2>Фитнес Тракер</h2>
        </div>

        <div class="streak-card">
            <div>
                <div style="font-size: 12px; color: var(--text-dim);">ТЕКУЩ СТРИЙК</div>
                <div class="streak-count">🔥 <span id="streak-val">0</span> Дни</div>
            </div>
            <div style="text-align: right;">
                <div style="font-size: 12px; color: var(--text-dim);">ТОЗИ МЕСЕЦ</div>
                <div style="font-size: 18px; font-weight: bold;" id="month-count">0 тренировки</div>
            </div>
        </div>

        <div class="calendar-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
    <button class="btn btn-secondary btn-small" onclick="changeMonth(-1)">◀</button>
    <h3 id="current-month-year" style="margin: 0;">Октомври 2026</h3>
    <button class="btn btn-secondary btn-small" onclick="changeMonth(1)">▶</button>
</div>
            <div class="calendar-grid">
                <div class="day-header">Пн</div>
                <div class="day-header">Вт</div>
                <div class="day-header">Ср</div>
                <div class="day-header">Чт</div>
                <div class="day-header">Пт</div>
                <div class="day-header">Сб</div>
                <div class="day-header">Нд</div>
            </div>
            <div class="calendar-grid" id="calendar-days"></div>
        </div>

        <h3>Избери тренировка за днес:</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <select id="program-select" style="flex: 1; padding: 12px; background: var(--card-bg); color: #fff; border: 1px solid var(--border-color); border-radius: 8px;">
            </select>
            <button class="btn btn-secondary btn-small" onclick="openNewProgramModal()">+ Нов шаблон</button>
        </div>

        <div id="active-workout-area"></div>
    </div>

    <!-- ТАБ 2: УПРАЖНЕНИЯ & РЕКОРДИ -->
    <div id="tab-records" class="tab-content">
        <h2>Рекорди & Прогрес</h2>
        <div id="exercise-records-list"></div>
    </div>
</div>

<!-- МОДАЛ ЗА ГРАФИКА -->
<div id="chart-modal" class="modal">
    <div class="modal-content">
        <h3 id="chart-title">Прогрес</h3>
        <canvas id="progressChart"></canvas>
        <button class="btn btn-secondary" style="margin-top: 15px;" onclick="closeModal()">Затвори</button>
    </div>
</div>

<!-- МОДАЛ ЗА НОВ ШАБЛОН -->
<div id="program-modal" class="modal">
    <div class="modal-content">
        <h3>Нова Програма / Шаблон</h3>
        <input type="text" id="new-program-name" placeholder="Име (напр. Arms Day)" style="width: 100%; margin-bottom: 10px; box-sizing: border-box;">
        <button class="btn" onclick="saveNewProgram()">Запази</button>
        <button class="btn btn-secondary" style="margin-top: 5px;" onclick="closeProgramModal()">Отказ</button>
    </div>
</div>

<!-- НАВИГАЦИЯ -->
<div class="nav-bar">
    <div class="nav-item active" onclick="switchTab('tracker')">
        <span>📅</span>
        <span>Календар</span>
    </div>
    <div class="nav-item" onclick="switchTab('records')">
        <span>🔥</span>
        <span>Рекорди</span>
    </div>
</div>

<script>
    // Начални базови програми
    const defaultPrograms = {
        "Pull Day": [
            "Lat Pulldown",
            "Reverse Peck Deck",
            "Incline Dumbbell Curls",
            "Hammer Curls",
            "Close Grip Seated Row",
            "Wide Grip Seated Rows"
        ],
        "Push Day": [
            "Bench Press",
            "Incline Bench Press",
            "Triceps Pushdown",
            "Overhead Triceps Extension",
            "Peck Deck",
            "Shoulder Press"
        ]
    };

    let appData = JSON.parse(localStorage.getItem('fitnessApp')) || {
        programs: defaultPrograms,
        logs: {}, // { 'YYYY-MM-DD': { program: 'Push Day', exercises: { 'Bench Press': [{weight: 80, reps: 10}] } } }
        records: {} // { 'Bench Press': 80 }
    };
    let currentDateView = new Date(); // Запомня кой месец разглеждаме в момента

    function saveData() {
        localStorage.setItem('fitnessApp', JSON.stringify(appData));
    }

    // Превключване на табове
    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        if(tab === 'tracker') {
            document.getElementById('tab-tracker').classList.add('active');
            document.querySelectorAll('.nav-item')[0].classList.add('active');
        } else {
            document.getElementById('tab-records').classList.add('active');
            document.querySelectorAll('.nav-item')[1].classList.add('active');
            renderRecords();
        }
    }

    // Рендериране на Календар
function changeMonth(direction) {
        currentDateView.setMonth(currentDateView.getMonth() + direction);
        renderCalendar();
    }

    function renderCalendar() {
        const year = currentDateView.getFullYear();
        const month = currentDateView.getMonth();
        
        const monthNames = ["Януари", "Февруари", "Март", "Април", "Май", "Юни", "Юли", "Август", "Септември", "Октомври", "Ноември", "Декември"];
        document.getElementById('current-month-year').innerText = `${monthNames[month]} ${year}`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        const calendarGrid = document.getElementById('calendar-days');
        calendarGrid.innerHTML = '';

        let offset = firstDay === 0 ? 6 : firstDay - 1; 

        for(let i = 0; i < offset; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.classList.add('day-cell', 'empty');
            calendarGrid.appendChild(emptyCell);
        }

        let monthWorkouts = 0;
        const todayStr = new Date().toISOString().split('T')[0];

        for(let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const cell = document.createElement('div');
            cell.classList.add('day-cell');
            cell.innerText = day;

            if(dateStr === todayStr) {
                cell.classList.add('today');
            }

            if(appData.logs[dateStr]) {
                cell.classList.add('active-workout');
                monthWorkouts++;
            }

            cell.onclick = () => handleDateClick(dateStr);
            calendarGrid.appendChild(cell);
        }

        document.getElementById('month-count').innerText = `${monthWorkouts} тренировки`;
        calculateStreak();
    }

    function handleDateClick(dateStr) {
        const todayStr = new Date().toISOString().split('T')[0];
        const area = document.getElementById('active-workout-area');

        // Ако е минал ден или бъдещ, но НЕ е днес
        if(dateStr < todayStr) {
            if(appData.logs[dateStr]) {
                // Има тренировка
                const log = appData.logs[dateStr];
                let html = `<h3>Преглед за ${dateStr} (${log.program})</h3>`;
                for(let ex in log.exercises) {
                    const data = log.exercises[ex][0];
                    html += `
                        <div class="exercise-card">
                            <div class="exercise-title"><span>${ex}</span></div>
                            <div style="font-size: 14px; color: var(--text-dim);">
                                Серии: <b>${data.sets || 0}</b> | Кг: <b>${data.weight || 0}</b> | Повторения: <b>${data.reps || 0}</b>
                            </div>
                        </div>
                    `;
                }
                area.innerHTML = html;
            } else {
                // Няма тренировка в миналото
                area.innerHTML = `
                    <div class="exercise-card" style="text-align: center; border-color: #d32f2f;">
                        <h3>Дата: ${dateStr}</h3>
                        <p style="color: #ff5252; font-size: 18px; font-weight: bold;">Голям си педал, не си тренирал на този ден! 🫵😂</p>
                    </div>
                `;
            }
        } else if(dateStr > todayStr) {
            alert("Не можеш да планираш в бъдещето, комши! Фокусирай се върху днешния ден.");
        } else {
            // Днешният ден е - зареждаме нормално програмата за редактиране/попълване
            const selectVal = document.getElementById('program-select').value;
            renderWorkoutArea(selectVal);
        }
    }

    function calculateStreak() {
        let streak = 0;
        let checkDate = new Date();
        
        while(true) {
            let dateStr = checkDate.toISOString().split('T')[0];
            if(appData.logs[dateStr]) {
                streak++;
                checkDate.setDate(checkDate.getDate() - 1);
            } else {
                break;
            }
        }
        document.getElementById('streak-val').innerText = streak;
    }

    // Зареждане на програми в падащото меню
    function loadProgramOptions() {
        const select = document.getElementById('program-select');
        select.innerHTML = '';
        for(let prog in appData.programs) {
            const opt = document.createElement('option');
            opt.value = prog;
            opt.innerText = prog;
            select.appendChild(opt);
        }
        select.onchange = (e) => renderWorkoutArea(e.target.value);
        if(select.value) renderWorkoutArea(select.value);
    }

   function renderWorkoutArea(progName) {
        const area = document.getElementById('active-workout-area');
        const exercises = appData.programs[progName] || [];
        
        // Бутон за изтриване на цялата програма (освен ако не са базовите Pull/Push)
        let deleteProgBtn = (progName !== "Pull Day" && progName !== "Push Day") 
            ? `<button class="btn btn-secondary btn-small" style="background-color: #d32f2f; color: #fff; margin-bottom: 15px;" onclick="deleteProgram('${progName}')">🗑️ Изтрий програмата</button>` 
            : '';

        let html = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3>Упражнения (${progName})</h3>
                ${deleteProgBtn}
            </div>
        `;

        exercises.forEach((ex, idx) => {
            html += `
                <div class="exercise-card">
                    <div class="exercise-title">
                        <span>${ex}</span>
                        <button class="btn btn-secondary btn-small" onclick="removeExerciseFromProg('${progName}', ${idx})" title="Премахни упражнение">✕</button>
                    </div>
                    <div class="set-row">
                        <label style="font-size: 12px; color: var(--text-dim);">Серии:</label>
                        <input type="number" id="sets-${idx}" placeholder="3" style="width: 50px;">
                        <label style="font-size: 12px; color: var(--text-dim);">Кг:</label>
                        <input type="number" id="weight-${idx}" placeholder="0" style="width: 60px;">
                        <label style="font-size: 12px; color: var(--text-dim);">Повт:</label>
                        <input type="number" id="reps-${idx}" placeholder="0" style="width: 60px;">
                    </div>
                </div>
            `;
        });

        html += `
            <button class="btn btn-secondary" style="margin-bottom: 10px;" onclick="addExerciseToProg('${progName}')">+ Добави упражнение</button>
            <button class="btn" onclick="saveTodayWorkout('${progName}')">Запази Тренировката</button>
        `;
        area.innerHTML = html;
    }
    function saveTodayWorkout(progName) {
        const today = new Date().toISOString().split('T')[0];
        const exercises = appData.programs[progName] || [];
        let workoutData = { program: progName, exercises: {} };

        exercises.forEach((ex, idx) => {
            const sets = parseInt(document.getElementById(`sets-${idx}`).value) || 0;
            const weight = parseFloat(document.getElementById(`weight-${idx}`).value) || 0;
            const reps = parseInt(document.getElementById(`reps-${idx}`).value) || 0;
            
            workoutData.exercises[ex] = [{ sets, weight, reps }];

            if(!appData.records[ex] || weight > appData.records[ex]) {
                if(weight > 0) {
                    appData.records[ex] = weight;
                }
            }
        });

        appData.logs[today] = workoutData;
        saveData();
        renderCalendar();
    }
    function addExerciseToProg(progName) {
        const name = prompt("Име на новото упражнение:");
        if(name) {
            appData.programs[progName].push(name);
            saveData();
            renderWorkoutArea(progName);
        }
    }

    function removeExerciseFromProg(progName, idx) {
        appData.programs[progName].splice(idx, 1);
        saveData();
        renderWorkoutArea(progName);
    }

    function openNewProgramModal() { document.getElementById('program-modal').style.display = 'flex'; }
    function closeProgramModal() { document.getElementById('program-modal').style.display = 'none'; }
    
    function saveNewProgram() {
        const name = document.getElementById('new-program-name').value;
        if(name) {
            appData.programs[name] = [];
            saveData();
            loadProgramOptions();
            closeProgramModal();
        }
    }

    // Рендериране на Рекорди & Графики
    let myChart = null;
    function renderRecords() {
        const list = document.getElementById('exercise-records-list');
        list.innerHTML = '';

        let allExercises = new Set();
        for(let prog in appData.programs) {
            appData.programs[prog].forEach(ex => allExercises.add(ex));
        }

        allExercises.forEach(ex => {
            const pr = appData.records[ex] || 0;
            const card = document.createElement('div');
            card.classList.add('exercise-card');
            card.style.cursor = 'pointer';
            card.innerHTML = `
                <div class="exercise-title">
                    <span>${ex}</span>
                    <span class="pr-fire">🔥 ${pr} кг</span>
                </div>
            `;
            card.onclick = () => showChart(ex);
            list.appendChild(card);
        });
    }

    function showChart(exerciseName) {
        document.getElementById('chart-title').innerText = exerciseName;
        document.getElementById('chart-modal').style.display = 'flex';

        let dates = [];
        let weights = [];

        for(let date in appData.logs) {
            if(appData.logs[date].exercises[exerciseName]) {
                dates.push(date);
                weights.push(appData.logs[date].exercises[exerciseName][0].weight);
            }
        }

        const ctx = document.getElementById('progressChart').getContext('2d');
        if(myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [{
                    label: 'Килограми (кг)',
                    data: weights,
                    borderColor: '#00e676',
                    backgroundColor: 'rgba(0, 230, 118, 0.2)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 6,
                    pointBackgroundColor: '#ff5722'
                }]
            },
            options: {
                scales: {
                    y: { beginAtZero: false, grid: { color: '#2a2a32' } },
                    x: { grid: { color: '#2a2a32' } }
                }
            }
        });
    }

    function closeModal() { document.getElementById('chart-modal').style.display = 'none'; }

    // Инициализация
    renderCalendar();
    loadProgramOptions();

    function deleteProgram(progName) {
        if(confirm(`Сигурен ли си, че искаш да изтриеш програмата "${progName}"?`)) {
            delete appData.programs[progName];
            saveData();
            loadProgramOptions();
        }
    }
    
</script>
</body>
</html>
